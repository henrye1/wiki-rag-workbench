# Render Blueprint: Workbench UI (public) + RAG API and Wiki API (private). Database: Supabase Cloud (see DEPLOY.md).
# Secrets marked `sync: false` are asked for when the Blueprint is first created.
services:
  - type: web
    name: workbench
    runtime: docker
    dockerfilePath: ./UI/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: 0.5c-512mb
    healthCheckPath: /healthz
    preDeployCommand: python -m bench.migrate
    envVars:
      - key: RAG_URL
        fromService: { name: rag, type: pserv, property: hostport }
      - key: RAG_API_KEY
        fromService: { name: rag, type: pserv, envVarKey: API_KEY }
      - key: WIKI_URL
        fromService: { name: wiki, type: pserv, property: hostport }
      - key: WIKI_API_KEY
        fromService: { name: wiki, type: pserv, envVarKey: API_KEY }
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY  # Ask screen: rewrites a chat's follow-up into a full question
        sync: false
      - key: UI_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - fromGroup: workbench-shared

  - type: pserv
    name: rag
    runtime: docker
    dockerfilePath: ./Rag/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: 0.5c-512mb
    preDeployCommand: python -m app.migrate
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY  # optional: keeps original uploads in Supabase Storage ("View original")
        sync: false
      - fromGroup: workbench-shared

  - type: pserv
    name: wiki
    runtime: docker
    dockerfilePath: ./Wiki/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: 0.5c-512mb
    preDeployCommand: python -m app.migrate
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY  # optional: keeps original uploads in Supabase Storage ("View original")
        sync: false
      - fromGroup: workbench-shared

envVarGroups:
  - name: workbench-shared
    envVars:
      - key: DB_POOL_MAX
        value: "4"  # 3 services share the Supabase pooler's client limit
      # One model per job; a setting left empty falls back to gemini-2.5-flash (shown on the home screen's Models card)
      - key: PARSER_MODEL  # wiki: reads uploaded files
        value: gemini-4-hydrogen
      - key: WRITER_MODEL  # wiki: notes, routing, planning, writing and fixing pages
        value: gemini-4-carbon
      - key: ANSWER_MODEL  # wiki: Ask and the wiki answers; workbench: Ask's follow-up rewrite
        value: gemini-4-carbon
      - key: LINT_MODEL  # wiki: lint health check
        value: gemini-4-carbon
      - key: SUGGEST_MODEL  # wiki: issuer, edition and part suggestions on the upload form
        value: gemini-4-carbon
      - key: RAG_ANSWER_MODEL  # rag: the RAG side's answers (Ask, bulk and the benchmark)
        value: gemini-4-carbon
